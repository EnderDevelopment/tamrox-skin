<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
    <!-- Head -->
    <rect x="16" y="0" width="32" height="32" fill="#333333" />
    <rect x="20" y="4" width="24" height="24" fill="#666666" />
    <rect x="24" y="8" width="16" height="16" fill="#999999" />
    
    <!-- Body -->
    <rect x="20" y="32" width="24" height="16" fill="#333333" />
    <rect x="24" y="36" width="16" height="8" fill="#666666" />
    
    <!-- Arms -->
    <rect x="0" y="32" width="20" height="12" fill="#333333" />
    <rect x="44" y="32" width="20" height="12" fill="#333333" />
    
    <!-- Legs -->
    <rect x="20" y="48" width="12" height="16" fill="#333333" />
    <rect x="32" y="48" width="12" height="16" fill="#333333" />
    
    <!-- Cybernetic Elements -->
    <rect x="24" y="12" width="4" height="4" fill="#FF0000" />
    <rect x="36" y="12" width="4" height="4" fill="#FF0000" />
    <rect x="24" y="24" width="4" height="4" fill="#FF0000" />
    <rect x="36" y="24" width="4" height="4" fill="#FF0000" />
    
    <!-- Lines for Futuristic Look -->
    <line x1="20" y1="4" x2="44" y2="4" stroke="#FF0000" stroke-width="2" />
    <line x1="20" y1="28" x2="44" y2="28" stroke="#FF0000" stroke-width="2" />
    <line x1="20" y1="32" x2="44" y2="32" stroke="#FF0000" stroke-width="2" />
    <line x1="20" y1="44" x2="44" y2="44" stroke="#FF0000" stroke-width="2" />
</svg>